name: Generar APK - Truco Extremo

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Buscar y descomprimir proyecto
        run: |
          mkdir proyecto
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró ningún archivo ZIP."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"
          unzip -q "$ZIP" -d proyecto

      - name: Buscar proyecto Android
        run: |
          echo "Buscando settings.gradle..."
          find proyecto -name settings.gradle -print

          SETTINGS=$(find proyecto -name settings.gradle -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró settings.gradle."
            echo "Contenido del proyecto:"
            find proyecto -maxdepth 4 -type f | head -100
            exit 1
          fi

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        run: |
          SETTINGS=$(find proyecto -name settings.gradle -print -quit)
          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Proyecto encontrado en: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          gradle assembleDebug --no-daemon

      - name: Comprobar APK
        run: |
          echo "Buscando APK..."
          find proyecto -path "*/app/build/outputs/apk/debug/*.apk" -print

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: TrucoExtremo-APK
          path: proyecto/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
