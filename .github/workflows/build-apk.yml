name: Generar APK - Truco Extremo

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          mkdir proyecto
          unzip -q Truco_Extremo_Jugable_v1.zip -d proyecto

      - name: Buscar proyecto Android
        run: |
          echo "Buscando settings.gradle..."
          find proyecto -name settings.gradle -print

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        run: |
          PROJECT_DIR=$(dirname "$(find proyecto -name settings.gradle -print -quit)")
          echo "Proyecto encontrado en: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: TrucoExtremo-APK
          path: proyecto/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
